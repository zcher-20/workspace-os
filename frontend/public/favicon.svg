<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Columbia blue background -->
  <rect width="100" height="100" rx="14" fill="#002855"/>

  <!-- Crown silhouette: three-pointed with orbs -->
  <path d="M18 80 L18 56 L28 34 L40 52 L50 22 L60 52 L72 34 L82 56 L82 80 Z" fill="white"/>

  <!-- Base band -->
  <rect x="14" y="76" width="72" height="13" rx="2" fill="white"/>

  <!-- Orbs at the three crown points -->
  <circle cx="28" cy="30" r="8" fill="white"/>
  <circle cx="50" cy="18" r="8" fill="white"/>
  <circle cx="72" cy="30" r="8" fill="white"/>

  <!-- Decorative jewels on the base band -->
  <circle cx="33" cy="82" r="3.5" fill="#002855"/>
  <circle cx="50" cy="82" r="3.5" fill="#002855"/>
  <circle cx="67" cy="82" r="3.5" fill="#002855"/>
</svg>
